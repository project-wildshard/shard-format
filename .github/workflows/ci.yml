name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Org git dependencies are public (J160, J163). pnpm-lock.yaml can record
      # them as git@github.com:..., so every URL form goes to plain HTTPS.
      - name: Read org repos over HTTPS
        run: |
          base="https://github.com/project-wildshard/"
          git config --global url."$base".insteadOf "git@github.com:project-wildshard/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:hooks
      - run: pnpm test:ci

  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:wire

  # WS1 cross-repo access is an operator prerequisite, not a push gate.
  # Keep the real install probes mandatory when explicitly dispatched.
  wire-git-install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The private API half runs in api-server/wire-install-probe.yml using
    # that repository's own checkout token. No App key is needed here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-wildshard/engine
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Read org repos over HTTPS
        run: |
          base="https://github.com/project-wildshard/"
          git config --global url."$base".insteadOf "git@github.com:project-wildshard/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
      - name: Install the exact wire subdirectory in a consumer
        env:
          WIRE_SHA: ${{ github.sha }}
        run: |
          pnpm add "@wildshard/wire@github:project-wildshard/shardfile#$WIRE_SHA&path:/packages/wire"
          pnpm install --frozen-lockfile
          node --input-type=module -e "import { WIRE_PACKAGE_VERSION } from '@wildshard/wire/version'; if (WIRE_PACKAGE_VERSION !== '0.0.0') throw new Error('Wrong wire package')"
          pnpm exec wire check
