# SHARD-COMPAT FE5 (meta, J486, Q51): every stored shard against this format. `wildshard-format corpus` (FE3,
# src/cli/corpus.ts) reads the public catalogue (GET https://api.wildshard.io/api/shardfiles), downloads each kept
# original once by hash, and validates it as stored (`judged: 'stored'`); one the format refuses is judged again
# through the migration chain (J486, src/cli/corpus-migrated.ts). It exits 3 naming every shard that still fails.
# The release job (npm-publish.yml) runs it on the tagged commit before `npm publish`; it also runs nightly on main.
# ZONE-SNAPSHOTS ZS3 (J507): it judges only the live set (engine's production and staging pins); any failure blocks
# (no known-failures list), and a listed original that is neither live, a rollback copy nor a channel's pointer is
# store drift and blocks too (`--strict-store`, on since ZS11: 95 listed, 31 live valid, 0 drift on 11-25). It runs at 10:17 UTC, after the API's 09:17 prune. Never in the pre-push gate. The downloads are public: no R2 token is needed. Downloads and verdicts are cached by
# shard hash, and a verdict is re-checked whenever the validator changes.
name: corpus

on:
  workflow_call:
    # meta QA 11-25 row 45: a format release asks for every stored shard to read, not for a clean store. Store drift
    # (another lane's superseded or proof upload the 09:17 prune has not taken yet) held v0.79.0's publish, so the
    # release passes `store: reads`; the nightly and a dispatch keep --strict-store.
    inputs:
      store:
        description: strict (the nightly) or reads (a release, drift reported but not blocking)
        type: string
        default: strict
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read org repos over HTTPS
        run: |
          base="https://github.com/project-wildshard/"
          git config --global url."$base".insteadOf "git@github.com:project-wildshard/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
      - run: pnpm install --frozen-lockfile
      # The originals are immutable by hash, so a cache from any earlier run is valid; a new key each run saves the
      # shards added since.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/corpus
          key: corpus-${{ github.run_id }}
          restore-keys: corpus-
      - name: Validate every stored shard
        env:
          STORE: ${{ inputs.store }}
        run: |
          started=$(date +%s)
          if [ "$STORE" = reads ]; then strict=(); else strict=(--strict-store); fi
          node src/cli/main.ts corpus --cache tmp/corpus "${strict[@]}"
          echo "::notice::corpus took $(( $(date +%s) - started )) s"
